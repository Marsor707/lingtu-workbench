name: 构建桌面安装包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布到已有标签（留空则仅构建 artifact）
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

# 避免同一分支或标签的重复构建占用 runner。
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 运行后端测试
        run: npm run backend:test

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            # 不能用 macos-14：它已被 GitHub 标记废弃（actions/runner-images#15226），
            # 而且官方表格里 macos-14 是 x64 镜像，与下面 aarch64-apple-darwin 目标矛盾，
            # 会直接被判成不支持的配置而在 0 秒内失败。macos-15 才是 arm64 镜像。
            os: macos-15
            bundle: app,dmg
            target: aarch64-apple-darwin
            artifact: lingtu-macos-arm64
          - name: Windows x64
            os: windows-2022
            bundle: nsis
            target: x86_64-pc-windows-msvc
            artifact: lingtu-windows-x64

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      # 用 npx 现取 CLI，而不是往项目里装：`npm install` 会忽略 package-lock 重新解析整棵树，
      # 曾把 @tauri-apps/api 从 2.11.1 顶到 2.12.3，与 Rust 侧 tauri 2.11.5 不同 minor，
      # 触发 Tauri 的版本不匹配检查而构建失败；npx 把 CLI 装到缓存目录，不碰项目依赖。
      - name: 构建 Tauri 安装包
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npx --yes '@tauri-apps/cli@^2' build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      # GitHub Release 会剥掉资产名里的非 ASCII 字符（中文 productName 会被整段删掉，
      # `灵图工作台_1.0.5_x64-setup.exe` → `_1.0.5_x64-setup.exe`），
      # 所以上传前先把安装包改成纯 ASCII 名；只改发布用文件名，不影响安装后的名称。
      - name: 规范安装包文件名
        run: node scripts/rename-installers.mjs

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # 版本 tag 或带 release_tag 的手动运行才创建 Release；留空时手动运行仅验证构建。
  release:
    name: 发布 GitHub Release
    # always() 是必需的：默认 needs 语义下只要 matrix 里任一平台失败（例如某天某个
    # runner 标签被下线），这个 job 就会被整体跳过，于是明明已经打好的 Windows 包
    # 也不会发出去，用户拿不到任何下载。发布只关心「哪些平台真的产出了包」，
    # 已在下面用 fail_on_unmatched_files 兜住完全无包的情况。
    if: >-
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      )
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载全部平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          # 某个平台构建失败时没有可分发的 artifact，不能让整个下载步骤报错退出。
          pattern: lingtu-*

      - name: 创建 GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          # 资产名由 scripts/rename-installers.mjs 规范为纯 ASCII，否则 GitHub 会剥掉中文；
          # .dmg 与 .exe 是更新源清单识别的平台资产，早期 macOS Intel 构建产出的 .zip 已随该构建一并移除。
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          # 说明由 GitHub 按提交自动生成；这里不手写平台列表，避免与实际情况不一致。
          generate_release_notes: true
          # 不能要 true：某个平台的构建 job 失败时那个格式自然匹配不到文件，
          # fail_on_unmatched_files 会把整次发布判失败，等于让「单平台故障」重新变成
          # 「所有平台都发不出」。完全没包的情况由上面的 if-no-files-found 与下载步骤兜底。
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检出源码
        uses: actions/checkout@v5

      # latest.json 必须在 Release 创建后生成：它的下载地址与大小依赖已上传的安装包资产。
      # softprops/action-gh-release 不输出 tag_name，只能用与上面 tag_name 字段一致的事件表达式。
      - name: 生成更新源清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json body -q .body > release-notes.md
          node scripts/generate-latest-json.mjs "$RELEASE_TAG" "$RELEASE_REPOSITORY" release-notes.md latest.json

      - name: 上传更新源清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" latest.json --repo "$RELEASE_REPOSITORY" --clobber
