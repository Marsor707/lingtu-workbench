name: 构建桌面安装包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布到已有标签（留空则仅构建 artifact）
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

# 避免同一分支或标签的重复构建占用 runner。
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 运行后端测试
        run: npm run backend:test

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            bundle: app,dmg
            target: aarch64-apple-darwin
            artifact: lingtu-macos-arm64
          - name: Windows x64
            os: windows-2022
            bundle: nsis
            target: x86_64-pc-windows-msvc
            artifact: lingtu-windows-x64

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Tauri CLI
        run: npm install --no-save --no-package-lock '@tauri-apps/cli@^2'

      # build:desktop 会按 TAURI_TARGET 生成对应架构的 Node sidecar；
      # tauri build 随后执行 tauri.conf.json 中的 beforeBuildCommand。
      - name: 构建 Tauri 安装包
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npx --no-install tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # 版本 tag 或带 release_tag 的手动运行才创建 Release；留空时手动运行仅验证构建。
  release:
    name: 发布 GitHub Release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载全部平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          # 只发布两端安装包：.dmg 与 .exe 是更新源清单识别的平台资产；
          # 早期 macOS Intel 构建产出的 .zip 已随该构建一并移除。
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检出源码
        uses: actions/checkout@v5

      # latest.json 必须在 Release 创建后生成：它的下载地址与大小依赖已上传的安装包资产。
      # softprops/action-gh-release 不输出 tag_name，只能用与上面 tag_name 字段一致的事件表达式。
      - name: 生成更新源清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json body -q .body > release-notes.md
          node scripts/generate-latest-json.mjs "$RELEASE_TAG" "$RELEASE_REPOSITORY" release-notes.md latest.json

      - name: 上传更新源清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" latest.json --repo "$RELEASE_REPOSITORY" --clobber
