[project]
name = "lingtu-workbench-backend"
version = "0.1.0"
description = "灵图工作台本地服务"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.22,<1",
  "alembic>=1.19,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.14,<5",
  "pillow>=12,<13",
  "pydantic>=2.13,<3",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.32,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.22,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.26,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
